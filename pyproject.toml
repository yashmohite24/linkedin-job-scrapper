[project]
name = "linkedin-jobs"
version = "0.1.0"
description = "Hourly scraper for public LinkedIn guest job listings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "supabase>=2.34.1",
]

[project.scripts]
linkedin-jobs = "linkedin_jobs.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
