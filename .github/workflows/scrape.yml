name: Scrape LinkedIn jobs

on:
  schedule:
    # 03:30–18:30 UTC = 09:00–00:00 Asia/Kolkata, hourly, both ends included.
    - cron: "30 3-18 * * *"
  workflow_dispatch:

concurrency:
  group: linkedin-jobs-scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python -m linkedin_jobs run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KEYWORDS: Product Manager
          LOCATION: India
          GEO_ID: "102713980"
          TIME_FILTER: r86400
          TIMEZONE: Asia/Kolkata
          WINDOW_START: "09:00"
          WINDOW_END: "00:00"
